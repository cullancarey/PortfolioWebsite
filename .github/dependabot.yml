version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"

  - package-ecosystem: "pip"
    directory: "/cdk"
    schedule:
      interval: "weekly"
    ignore:
      # ecdsa has no patched release for the Minerva timing-attack advisory (GHSA
      # maintainers consider side-channel attacks out of scope). It's only a
      # transitive dev dependency of checkov's unused JWT/cloud-auth code path.
      - dependency-name: "ecdsa"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"